name: Rebuild single-file website from source
on:
  push:
    branches:
      - fix/model-integrity-2026-11-02
    paths:
      - 'source/**'
      - '.github/workflows/rebuild-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate source JavaScript
        run: node --check source/sim.js
      - name: Rebuild application and check consistency
        run: |
          python source/build.py
          python source/build.py --check
      - name: Commit generated HTML for GitHub Pages
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: regenerate site from corrected simulation source"
            git push
          fi
