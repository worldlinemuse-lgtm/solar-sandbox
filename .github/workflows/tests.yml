name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test tools
        run: |
          pip install playwright pvlib pandas numpy
          python -m playwright install --with-deps chromium
      - name: Compile independent typed physics core
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.8.3 esbuild@0.25.8
          ./node_modules/.bin/tsc --project tsconfig.next-core.json
          ./node_modules/.bin/esbuild source/next-core/entry.ts --bundle --minify --format=iife --global-name=SolarNextCore --target=es2020 --outfile=source/next-core-browser.js
      - name: Browser-side reference-only engine bridge
        run: python tests/test_next_core_bridge.py
      - name: Next-core external fixtures, invariants and edge cases
        run: node --test tests/next-core/*.test.cjs
      - name: Next-core thermal and PV DC benchmarks versus pvlib
        run: python tests/next_core_pvlib.py
      - name: Run full-day synthetic power-flow reference and energy ledger
        run: node scripts/next-core-reference.cjs > /dev/null
      - name: Verify pinned browser mathematical bundle is byte-identical to source
        run: git diff --exit-code -- source/next-core-browser.js
      - name: Page matches the source build
        run: python source/build.py --check
      - name: Model integrity regressions (battery, loads, generator)
        run: python tests/test_integrity.py
      - name: Page test suite (skips the slow 25-winter runs)
        run: SKIP_WINTERS=1 python tests/test_v7.py
      - name: Model correctness gate (24-hour invariants and 50 winters)
        run: python tests/test_correctness_gate.py
      - name: Async analysis input-integrity regressions
        run: python tests/test_batch_input_isolation.py
      - name: Independent published-specification and circuit-reference fixtures
        run: python tests/test_reference_fixtures.py
      - name: Reproducible user-facing analysis exports
        run: python tests/test_analysis_exports.py
      - name: Solar check against pvlib
        run: python tests/check_solar.py
      - name: Offline install check
        run: python tests/test_pwa.py
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/test_v7_results.json
            tests/correctness_results.json
